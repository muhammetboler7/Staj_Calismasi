# Kaynak: Kamera_Kalibrasyon_Parametreleri_2025.txt / _2026.txt "Termal Camera
# Intrinsics" (iki dosyada birebir ayni deger) - native cozunurluk, olcekleme yok.

File.version: "1.0"

Camera.type: "PinHole"

Camera1.fx: 731.7965
Camera1.fy: 732.0172
