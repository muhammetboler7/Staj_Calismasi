%YAML:1.0

# 2024_TUYZ_Online_Yarisma_Ana_Oturum icin aday kalibrasyon A.
# Kaynak: Kamera_Kalibrasyon_Parametreleri_2025.txt / _2026.txt "RGB Camera 4K"
# (native 4000x3000, iki dosyada birebir ayni deger).
# Video 1920x1080'e temiz 2x olcekleme DEGIL - 4:3 kaynaktan 16:9 hedefe
# tam genislik + dikey merkez kirpma varsayimiyla uyarlandi (crop=180px/kenar).

File.version: "1.0"

Camera.type: "PinHole"

Camera1.fx: 1340.26
Camera1.fy: 1341.70
Camera1.cx: 954.24
Camera1.cy: 569.86

Camera1.k1: 0.0798
Camera1.k2: -0.1867
Camera1.p1: 0.0
